<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISS NAILS - Reset auth</title><style>body{font-family:Arial;max-width:680px;margin:40px auto;padding:20px}button,input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc}button{cursor:pointer;font-weight:bold}#estado{white-space:pre-wrap;background:#f5f5f5;padding:12px;margin-top:15px}</style></head><body><h1>MISS NAILS — Reset de autenticación</h1><p>Herramienta temporal. No modifica el código normal de autenticación.</p><h2>Google</h2><input id="googleEmail" type="email" placeholder="Correo de Google"><button onclick="resetGoogle()">Revocar Google + limpiar estado</button><h2>Microsoft</h2><button onclick="resetMicrosoft()">Cerrar sesión Microsoft + limpiar estado</button><p><small>Para eliminar el consentimiento de Microsoft, usa la administración de permisos de tu cuenta Microsoft después del cierre de sesión.</small></p><h2>Reset total</h2><button onclick="resetTotal()">RESET GOOGLE + MICROSOFT + MISS NAILS</button><div id="estado">Listo.</div><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const GOOGLE_CLIENT_ID='375980187783-shvrkd8d0nkeaem7tju07co7bponc9ev.apps.googleusercontent.com';
const MS_LOGOUT='https://login.microsoftonline.com/common/oauth2/v2.0/logout';
const APP='https://gabriel-ceballos.github.io/MISS-NAILS/';
const $=id=>document.getElementById(id);function msg(x){$('estado').textContent=x}
function local(){localStorage.removeItem('missNailsSesion');sessionStorage.removeItem('missNailsMicrosoftAuth')}
function googleReady(){return new Promise((ok,no)=>{let t=Date.now();(function r(){if(window.google?.accounts?.id)return ok();if(Date.now()-t>8000)return no(new Error('Google Identity Services no estuvo disponible.'));setTimeout(r,100)})()})}
async function revokeGoogle(){let e=$('googleEmail').value.trim();if(!e){msg('Escribe el correo de Google que autorizaste.');return false}try{await googleReady();google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:()=>{}});google.accounts.id.disableAutoSelect();return await new Promise(resolve=>google.accounts.id.revoke(e,r=>{local();if(r?.error){msg('ERROR Google: '+JSON.stringify(r));resolve(false)}else{msg('OK: Google revocado para '+e+'. Selección automática desactivada y estado local limpiado.');resolve(true)}}))}catch(e){msg('ERROR Google: '+e.message);return false}}
function resetMicrosoft(){local();msg('Cerrando sesión Microsoft...');setTimeout(()=>location.assign(MS_LOGOUT+'?post_logout_redirect_uri='+encodeURIComponent(APP)),300)}
async function resetGoogle(){await revokeGoogle()}
async function resetTotal(){let ok=await revokeGoogle();if(ok){msg('Google revocado. Cerrando sesión Microsoft...');setTimeout(()=>location.assign(MS_LOGOUT+'?post_logout_redirect_uri='+encodeURIComponent(APP)),700)}}
</script></body></html>
