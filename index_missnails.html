<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MISS NAILS</title>


    <!-- =====================================================
         ESTILOS DE LA NUEVA APLICACIÓN
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/Miss_Nails_style.css">


</head>


<body>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <main id="app"></main>


    <!-- =====================================================
         API
         ===================================================== -->

    <script src="api/api.js"></script>


    <!-- =====================================================
         MEMORIA MÍNIMA DE LA NUEVA APLICACIÓN
         =====================================================

         Se mantiene aquí temporalmente porque
         Vista Catálogo Móvil.js la utiliza.

         No depende de la aplicación anterior.
         ===================================================== -->

    <script>

        const memoriaApp = {

            clave:
                "missNailsNuevoEstado",

            guardar(estado) {

                sessionStorage.setItem(
                    this.clave,
                    JSON.stringify(estado)
                );

            },


            cargar() {

                const estado =
                    sessionStorage.getItem(
                        this.clave
                    );

                return estado
                    ? JSON.parse(estado)
                    : null;

            },


            limpiar() {

                sessionStorage.removeItem(
                    this.clave
                );

            }

        };

    </script>


    <!-- =====================================================
         NUEVA VISTA CATÁLOGO MÓVIL
         ===================================================== -->

    <script
        src="views/Vista Catálogo Móvil.js">
    </script>


    <!-- =====================================================
         INICIAR NUEVA APLICACIÓN
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                if (
                    window.vistaCatalogoMobile &&
                    typeof
                    window.vistaCatalogoMobile.mostrar
                    === "function"
                ) {

                    await
                    window.vistaCatalogoMobile.mostrar();

                } else {

                    console.error(
                        "MISS NAILS → no se encontró Vista Catálogo Móvil"
                    );

                }

            }
        );

    </script>


</body>

</html>
